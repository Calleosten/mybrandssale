name: Daily price scrape

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        working-directory: prisapp 3/scraper
        run: pip install -r requirements.txt

      - name: Kör scraper
        working-directory: prisapp 3/scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FCM_SERVICE_ACCOUNT_PATH: firebase-key.json
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FCM_SERVICE_ACCOUNT_JSON" > firebase-key.json
          python scraper.py
